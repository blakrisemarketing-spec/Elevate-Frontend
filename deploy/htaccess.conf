# Elevate Career Hub, Hostinger (LiteSpeed/Apache) config.
# Copied to dist/.htaccess at build by scripts/build-priority-routes.mjs.
# This is the Hostinger source of truth for headers + redirects.

Options -Indexes

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=()"
  Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://js.paystack.co https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://s2s.elevatecareerhub.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.paystack.co https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://connect.facebook.net https://www.facebook.com https://s2s.elevatecareerhub.com; frame-src https://checkout.paystack.com https://*.paystack.co https://player.vimeo.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"

  # Keep non-production hosts (staging.*) out of search indexes. Production
  # (elevatecareerhub.com / www) is unaffected, so no rebuild is needed to flip it.
  SetEnvIfNoCase Host "^staging\." ECH_NOINDEX=1
  Header always set X-Robots-Tag "noindex, nofollow" env=ECH_NOINDEX
</IfModule>

<IfModule mod_rewrite.c>
  RewriteEngine On

  # First-party ad attribution with zero page JS. A landing URL carrying UTM
  # params, or a visit referred by another site, drops 90-day cookies that
  # verify-payment.php and quiz-lead.php read back (the same-origin fetch sends
  # them). Values are limited to a safe charset; [CO] lifetime is in minutes.
  RewriteCond %{QUERY_STRING} (?:^|&)utm_source=([A-Za-z0-9_.+%-]{1,80})
  RewriteRule ^ - [CO=ech_utm_source:%1:%{SERVER_NAME}:129600:/:true:false:Lax]
  RewriteCond %{QUERY_STRING} (?:^|&)utm_medium=([A-Za-z0-9_.+%-]{1,80})
  RewriteRule ^ - [CO=ech_utm_medium:%1:%{SERVER_NAME}:129600:/:true:false:Lax]
  RewriteCond %{QUERY_STRING} (?:^|&)utm_campaign=([A-Za-z0-9_.+%-]{1,120})
  RewriteRule ^ - [CO=ech_utm_campaign:%1:%{SERVER_NAME}:129600:/:true:false:Lax]
  RewriteCond %{REQUEST_URI} !^/(api|assets|fonts|downloads)/
  RewriteCond %{HTTP_REFERER} !^https?://([^/]*\.)?elevatecareerhub\.com [NC]
  RewriteCond %{HTTP_REFERER} ^https?://([A-Za-z0-9.-]{1,120})
  RewriteRule ^ - [CO=ech_ref:%1:%{SERVER_NAME}:129600:/:true:false:Lax]

  # Assisted-commerce redirects (cart/checkout/account are not MVP) → contact
  RewriteRule ^cart/?$ /contact-us/ [R=302,L]
  RewriteRule ^checkout/?$ /contact-us/ [R=302,L]
  RewriteRule ^my-account/?$ /contact-us/ [R=302,L]
  RewriteRule ^shop/?$ /contact-us/ [R=302,L]
  RewriteRule ^manage-profile/?$ /contact-us/ [R=302,L]

  # Legacy WordPress index.php aliases (permanent)
  RewriteRule ^index\.php/about/?$ /about/ [R=301,L]
  RewriteRule ^index\.php/contact-us/?$ /contact-us/ [R=301,L]
  RewriteRule ^index\.php/diy-products/?$ /diy-products/ [R=301,L]
</IfModule>

# Every page is a real static file (dist/<route>/index.html), so anything not
# matched above is a genuine 404. Apache preserves the 404 status.
ErrorDocument 404 /404.html

# Long-cache static assets. Every asset a page references is fingerprinted at
# build (checkout.<hash>.js, naa-about.<hash>.webp, ...), so a changed file gets
# a new URL. HTML must therefore revalidate on every visit, or a browser keeps
# an old page that points at the old asset URLs.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/html "access plus 0 seconds"
  ExpiresByType image/svg+xml "access plus 1 year"
  ExpiresByType image/x-icon "access plus 1 week"
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType text/javascript "access plus 1 year"
  ExpiresByType image/webp "access plus 1 year"
  ExpiresByType image/png "access plus 1 year"
  ExpiresByType image/jpeg "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType application/pdf "access plus 1 week"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>

# Never serve secrets or config if they ever land in the web root
<FilesMatch "^(config\.php|\.env.*)$">
  Require all denied
</FilesMatch>

# Include-only PHP libraries: loaded by the endpoints via require_once (a
# filesystem read, unaffected by this), never meant to be requested directly.
# Anchored so endpoints such as lead-campaign-unsubscribe.php stay reachable.
<FilesMatch "^(admin-auth|email|lead-campaign|ops-store|portal-auth|store|supabase)\.php$">
  Require all denied
</FilesMatch>
