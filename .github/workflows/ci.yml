name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches package.json engines + Hostinger runtime
          cache: npm

      # npm, not pnpm — Hostinger's corepack crashes on pnpm (see CLAUDE.md).
      - name: Install dependencies
        run: npm ci

      # Full production build: tsc typecheck -> tailwind -> SSG (copies
      # public/, renders every page, fingerprints images/fonts, builds the
      # islands, api/*.php, .htaccess). No secrets needed;
      # VITE_PAYSTACK_PUBLIC_KEY defaults to "" for a structure-only build.
      - name: Build
        run: npm run build

      # Titles/descriptions present, no stray scripts, internal links + assets
      # resolve, every image/font reference is fingerprinted.
      - name: Content audit
        run: npm run audit

      # Every built route serves a 200 with rendered content.
      - name: Direct-route smoke
        run: node scripts/smoke-direct-routes.mjs
