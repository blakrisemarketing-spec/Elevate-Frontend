name: Lead campaign cron

# The Grad School Match bootcamp nurture campaign ended on 2026-07-28 (the
# cohort started 26 July). The every-15-minutes schedule is intentionally
# disabled so no more nurture emails go out; ech_campaign_run_due() also has a
# hard kill-switch as a second layer. Kept as workflow_dispatch (manual only)
# so the drain/reconcile plumbing survives for a future cohort. To relaunch,
# restore the schedule below AND remove the kill-switch in api/lead-campaign.php.
on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-lead-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduled lead campaign
        env:
          CRON_SECRET: ${{ secrets.LEAD_CAMPAIGN_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --get \
            --data-urlencode "secret=$CRON_SECRET" \
            --data-urlencode "limit=20" \
            "https://elevatecareerhub.com/api/run-lead-campaign.php"
